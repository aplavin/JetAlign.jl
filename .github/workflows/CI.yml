name: CI

on: [push, pull_request]

env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  JULIA_PKG_SERVER:
  PYTHON:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.11']
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev xsettingsd x11-xserver-utils
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mesa freeglut
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Enable software rendering for headless OpenGL on Windows
          echo "Setting up software rendering for OpenGL"
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - uses: julia-actions/cache@v2
      # - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests (Linux with virtual display)
        if: runner.os == 'Linux'
        run: DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' julia --project -e 'using Pkg; Pkg.test(julia_args=`--check-bounds=auto`)'
      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: julia --project -e 'using Pkg; Pkg.test(julia_args=`--check-bounds=auto`)'
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ runner.os == 'Windows' && '1' || '' }}
